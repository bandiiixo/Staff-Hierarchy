<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KNG Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><div class="schedule-loading"><div class="loading-card"><strong>KNG Schedule</strong><span>Starting the schedule...</span></div></div></div>
  <script>
    window.__kngBootError = function (message) {
      var el = document.getElementById("app");
      if (!el) return;
      el.innerHTML = '<div class="schedule-error"><h1>KNG Schedule</h1><p>The website loaded, but one of its startup files failed.</p><pre>' + String(message || "Unknown startup error").replace(/[&<>]/g, function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c];}) + '</pre><p>Open the browser console if you need the technical error.</p></div>';
    };
    window.addEventListener("error", function (e) {
      if (e && e.error) window.__kngBootError(e.error.message || e.message);
      else if (e) window.__kngBootError(e.message || "Unknown script error");
    });
    window.addEventListener("unhandledrejection", function (e) {
      var r = e && e.reason;
      window.__kngBootError(r && (r.message || String(r)) || "Unhandled promise rejection");
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      var fallback = document.createElement("script");
      fallback.src = "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js";
      fallback.onerror = function(){ window.__kngBootError("Supabase library could not be loaded from either CDN."); };
      document.head.appendChild(fallback);
    }
  </script>
  <script src="supabase.js?v=20261031-2135"></script>
  <script src="app.js?v=20261109-render-ops-helpers-fix"></script>
</body>
</html>
